[project]
name = "tunelab"
version = "0.1.0"
description = "Programmatic melody exploration: generate, score, flag, listen"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "numpy", "scipy", "librosa"]

[project.scripts]
tunelab = "tunelab.server:main"
tunelab-extract = "tunelab.extract:main"
tunelab-check = "tunelab.check:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "playwright>=1.65.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tunelab"]
