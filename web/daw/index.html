<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tunelab DAW</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/web/shared/base.css">
<link rel="stylesheet" href="/web/daw/daw.css">
</head>
<body>
<header class="app">
  <h1>Tunelab</h1>
  <nav><a href="/daw" aria-current="page">DAW</a><a href="/generator">Tune Generator</a></nav>
  <div class="row" id="filebar">
    <button id="b-new">New</button>
    <button id="b-library">Library</button>
    <button id="b-import">Import</button>
    <button id="b-save">Save</button>
    <button id="b-more" popovertarget="more">Save as / export</button>
    <div id="more" popover>
      <button id="b-saveas">Save project as…</button>
      <button id="b-savemelody">Save track as melody…</button>
      <hr>
      <button id="b-exp-project">Export project (.json)</button>
      <button id="b-exp-midi">Export MIDI (.mid)</button>
      <button id="b-exp-melody">Export track as melody (.json)</button>
      <button id="b-exp-text">Export track as notation (.tune)</button>
    </div>
    <input type="file" id="file" accept=".json,.mid,.midi,.tune,.txt" hidden>
  </div>
  <span id="title"></span>
  <span class="grow"></span>
  <button id="b-tools">Tools</button>
  <button id="b-settings">Settings</button>
</header>
<div class="bar">
  <div class="row">
    <button id="b-play" class="primary">Play</button>
    <button id="b-stop">Stop</button>
    <span id="pos" class="num">1.1</span>
  </div>
  <div class="row">
    <label>BPM <input id="bpm" class="short" inputmode="decimal"></label>
    <label>Meter <select id="meter"></select></label>
    <label>Key <select id="tonic"></select></label>
    <select id="mode" aria-label="Scale"></select>
  </div>
  <div class="row" role="group" aria-label="Tool">
    <button data-tool="select">Select</button><button data-tool="draw">Draw</button><button data-tool="erase">Erase</button>
  </div>
  <label>Grid <select id="snap"></select></label>
  <div class="row">
    <button id="b-undo">Undo</button><button id="b-redo">Redo</button>
  </div>
  <div class="row">
    <button id="b-zout" aria-label="Zoom out">−</button><button id="b-zin" aria-label="Zoom in">+</button><button id="b-fit">Fit</button>
  </div>
</div>
<main>
  <aside id="tracks"><div id="tracklist"></div><button id="b-addtrack">Add track</button></aside>
  <section id="roll" aria-label="Piano roll" tabindex="-1"></section>
</main>
<footer id="inspector"></footer>
<script src="/web/vendor/konva.min.js"></script>
<script src="/web/vendor/Tone.js"></script>
<script src="/web/vendor/Midi.js"></script>
<script type="module" src="/web/daw/main.js"></script>
</body>
</html>
